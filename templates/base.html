<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}민원ON - 실시간 민원실 대기현황{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <meta name="theme-color" content="#2563EB">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">🏛️ 민원ON</a>
      <span class="header-sub">전국 민원실 실시간 대기현황</span>
    </div>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>공공데이터포털 API 활용 서비스 · 민원실 실시간 대기현황 통합 플랫폼</p>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
